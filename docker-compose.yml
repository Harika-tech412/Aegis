services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_pw
      POSTGRES_DB: aegis
    ports:
      - "5433:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Same context and Dockerfile Render uses, so a local build proves the
    # deployed one. The bind mounts below are development conveniences layered
    # on top of an image that is already self-contained without them.
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Nested over the /app mount above so live edits to the shared ML code,
      # seed data and scripts are picked up, at the same paths the image bakes
      # them to (/app/ml, /app/data, /app/scripts).
      - ./ml:/app/ml
      - ./data:/app/data
      - ./scripts:/app/scripts
      # Persist the sentence-transformers model download across container
      # recreations (seeding and similar-cases both use it).
      - aegis_hf_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  aegis_pgdata:
  aegis_hf_cache:
