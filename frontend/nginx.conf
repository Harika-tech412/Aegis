server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: deep links like /applications/<uuid> resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
